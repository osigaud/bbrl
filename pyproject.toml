[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "bbrl"
license = {text = "MIT"}
authors = [
    { name = "Olivier Sigaud",  email = "Olivier.Sigaud@isir.upmc.fr" }
]
description = "RL library inspired from salina"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "torch>=1.9.0",
    "torchvision",
    "tensorboard",
    "tqdm",
    "hydra-core",
    "numpy",
    "pandas",
    "opencv-python",
    "omegaconf",
    "matplotlib",
    "seaborn",
    "scipy",
    "bootstrapped",
    "gymnasium>1",
    "moviepy",
]

[project.optional-dependencies]
test = ["pytest", "pytest-timeout"]

[project.urls]
repository = "https://github.com/osigaud/bbrl.git"

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/bbrl/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bbrl"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "C90",    # mccabe complexity
    "T20",    # flake8-print
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E203",   # whitespace before ':' (conflicts with black-style formatting)
    "E722",   # bare except
    "F401",   # unused imports (in __init__.py files)
]
per-file-ignores = {"__init__.py" = ["F401"]}

[tool.ruff.lint.mccabe]
max-complexity = 25
